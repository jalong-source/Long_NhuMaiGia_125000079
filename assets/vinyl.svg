<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="vinylShineDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#222228"/>
      <stop offset="60%" stop-color="#111114"/>
      <stop offset="90%" stop-color="#08080A"/>
      <stop offset="100%" stop-color="#020203"/>
    </radialGradient>
    <linearGradient id="goldLabelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
  </defs>
  <!-- Outer Vinyl Body -->
  <circle cx="100" cy="100" r="96" fill="url(#vinylShineDark)" stroke="#D4AF37" stroke-width="2.5"/>
  <!-- Grooves with subtle gold reflection -->
  <circle cx="100" cy="100" r="82" stroke="#2A2A30" stroke-width="1.5" stroke-dasharray="10 4"/>
  <circle cx="100" cy="100" r="70" stroke="#33333C" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="58" stroke="#2A2A30" stroke-width="1.5" stroke-dasharray="14 4"/>
  <circle cx="100" cy="100" r="46" stroke="#33333C" stroke-width="1.5"/>
  <!-- Center Gold Label -->
  <circle cx="100" cy="100" r="32" fill="url(#goldLabelGrad)"/>
  <circle cx="100" cy="100" r="12" fill="#0A0A0C" stroke="#FFFFFF" stroke-width="1"/>
  <circle cx="100" cy="100" r="4" fill="#FFFFFF"/>
</svg>
