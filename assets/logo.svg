<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366"/>
      <stop offset="50%" stop-color="#BA13F9"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="44" stroke="url(#logoGrad)" stroke-width="4" fill="#0D0E15" filter="url(#glow)"/>
  <!-- Equalizer bars inside circle -->
  <rect x="25" y="42" width="6" height="16" rx="3" fill="#00F0FF"/>
  <rect x="35" y="30" width="6" height="40" rx="3" fill="#BA13F9"/>
  <rect x="47" y="20" width="6" height="60" rx="3" fill="#FF3366"/>
  <rect x="59" y="34" width="6" height="32" rx="3" fill="#BA13F9"/>
  <rect x="69" y="45" width="6" height="10" rx="3" fill="#00F0FF"/>
</svg>
