<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Outer Gold Glowing Ring -->
  <circle cx="50" cy="50" r="44" stroke="url(#goldGrad)" stroke-width="3.5" fill="#0A0A0C" filter="url(#goldGlow)"/>
  <circle cx="50" cy="50" r="40" stroke="#26262B" stroke-width="1" fill="none"/>
  
  <!-- Equalizer bars inside circle (Gold - White - Gold) -->
  <rect x="25" y="42" width="6" height="16" rx="3" fill="#D4AF37"/>
  <rect x="35" y="30" width="6" height="40" rx="3" fill="#FFD700"/>
  <rect x="47" y="18" width="6" height="64" rx="3" fill="#FFFFFF" filter="url(#goldGlow)"/>
  <rect x="59" y="32" width="6" height="36" rx="3" fill="#FFD700"/>
  <rect x="69" y="45" width="6" height="10" rx="3" fill="#D4AF37"/>
</svg>
